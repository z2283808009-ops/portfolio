<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F9FA">
<title>周子 · 买量视频设计师 · 视频作品集</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232563EB'/%3E%3Cpath d='M25 20l20 12-20 12z' fill='white'/%3E%3C/svg%3E">
<style>
  /* ============================================================
     作品集 H5 —— 白色极简 + 浅灰磨砂玻璃（Light Glassmorphism）
     主色：#2563EB（深蓝） 标题：#0F172A 正文：#64748B
     ============================================================ */
  :root{
    --bg:#F8F9FA;
    --card-bg:rgba(255,255,255,0.75);
    --ink:#0F172A;
    --ink-2:#64748B;
    --accent:#2563EB;
    --line:rgba(15,23,42,0.07);
    --radius:20px;
    --shadow:0 10px 30px rgba(0,0,0,0.05);
    --card-w:min(78vw,400px);
    --edge:calc((100vw - var(--card-w)) / 2);
    --header-h:66px;
    --spring:cubic-bezier(0.34,1.56,0.64,1);
    --ease-out:cubic-bezier(0.22,1,0.36,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    overflow-x:hidden;min-height:100%;
  }
  button{font-family:inherit}
  img{-webkit-user-drag:none;user-select:none}

  /* ---- 背景氛围光（呼应简历深蓝，低饱和不破坏白底） ---- */
  .bg-glow{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(55% 42% at 50% -6%, rgba(37,99,235,0.10), transparent 70%),
      radial-gradient(45% 32% at 92% 26%, rgba(99,102,241,0.07), transparent 70%),
      radial-gradient(40% 30% at 4% 70%, rgba(37,99,235,0.05), transparent 70%);
  }

  /* ============ 顶部 Header：固定 + 毛玻璃 ============ */
  header{
    position:fixed;top:0;left:0;right:0;z-index:50;
    background:rgba(255,255,255,0.72);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    backdrop-filter:blur(20px) saturate(180%);
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    height:var(--header-h);max-width:1080px;margin:0 auto;
    padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .brand .name{font-size:17px;font-weight:700;letter-spacing:0.2px;line-height:1.2}
  .brand .role{font-size:12px;color:var(--ink-2);margin-top:3px}
  .contacts{display:flex;gap:8px}
  .contact-btn{
    display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;
    border:1px solid rgba(15,23,42,0.08);background:rgba(255,255,255,0.65);
    font-size:12.5px;font-weight:500;color:var(--ink-2);cursor:pointer;
    transition:transform .2s var(--spring), color .25s, border-color .25s;
    white-space:nowrap;
  }
  .contact-btn:hover{color:var(--accent);border-color:rgba(37,99,235,0.35)}
  .contact-btn:active{transform:scale(0.93)}
  .contact-btn svg{flex:0 0 auto}
  @media (max-width:640px){
    .contact-btn{padding:8px 10px}
    .contact-btn .label{display:none}
  }

  /* ============ 主体 ============ */
  main{position:relative;z-index:1;padding-top:var(--header-h)}

  /* ---- 分类 Tab：横向滑动 + 下划线指示器 ---- */
  .tabs{
    position:sticky;top:0;z-index:40;
    background:rgba(248,249,250,0.86);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(15,23,42,0.05);
  }
  .tabs-inner{
    position:relative;display:flex;align-items:center;gap:2px;
    max-width:1080px;margin:0 auto;padding:0 14px;
    overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .tabs-inner::-webkit-scrollbar{display:none}
  .tab{
    position:relative;padding:13px 14px 15px;font-size:14.5px;font-weight:600;
    color:var(--ink-2);background:none;border:none;cursor:pointer;white-space:nowrap;
    transition:color .25s;flex:0 0 auto;
  }
  .tab:active{transform:scale(0.96)}
  .tab.active{color:var(--ink)}
  .tab-indicator{
    position:absolute;bottom:8px;left:0;height:3px;border-radius:2px;
    background:var(--accent);pointer-events:none;
    transition:left .32s var(--spring), width .32s var(--spring);
  }

  /* ---- 卡片滑动区（核心）---- */
  .carousel-section{padding:20px 0 30px}
  .carousel{
    display:flex;gap:24px;overflow-x:auto;cursor:grab;
    scroll-snap-type:x mandatory;scroll-padding-inline:var(--edge);
    padding-inline:var(--edge);
    scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x;
  }
  .carousel::-webkit-scrollbar{display:none}
  .carousel.dragging{cursor:grabbing;scroll-behavior:auto}

  .work-card{
    flex:0 0 auto;width:var(--card-w);aspect-ratio:9/16;
    scroll-snap-align:center;position:relative;
    display:flex;flex-direction:column;overflow:hidden;cursor:pointer;
    border-radius:24px;background:var(--card-bg);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,0.85);outline:1px solid rgba(15,23,42,0.07);
    box-shadow:var(--shadow);
    transform:scale(0.9);opacity:0.5;
    transition:transform .35s var(--ease-out), opacity .35s var(--ease-out), box-shadow .35s;
    animation:cardIn .5s var(--spring) backwards;
  }
  @keyframes cardIn{from{opacity:0;transform:scale(0.82) translateY(18px)}}
  .work-card.active{transform:scale(1);opacity:1;box-shadow:0 18px 44px rgba(15,23,42,0.09)}
  .work-card:hover{box-shadow:0 18px 44px rgba(15,23,42,0.09)}

  .card-cover{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:#0b1220}
  .card-cover img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.03);transition:transform .5s var(--ease-out)}
  .work-card.active .card-cover img{transform:scale(1)}
  .card-cover::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,18,32,0) 55%,rgba(11,18,32,0.18))}

  .play-badge{
    position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;
    background:rgba(15,23,42,0.04);
  }
  .play-badge .circle{
    width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,0.88);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    box-shadow:0 6px 22px rgba(0,0,0,0.22);
    transition:transform .25s var(--spring);
  }
  .play-badge .circle svg{margin-left:3px}
  .work-card.active .play-badge .circle{animation:breath 2.2s ease-in-out infinite}
  @keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

  .card-body{
    flex:0 0 auto;padding:14px 16px 16px;background:rgba(255,255,255,0.62);
    border-top:1px solid rgba(15,23,42,0.04);
  }
  .card-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
  .tag{
    font-size:11px;font-weight:600;color:var(--accent);
    background:rgba(37,99,235,0.08);padding:3px 9px;border-radius:999px;
  }
  .card-title{
    font-size:15px;font-weight:700;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card-desc{
    font-size:12.5px;color:var(--ink-2);margin-top:6px;line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }

  .empty{
    width:100%;padding:90px 0 110px;text-align:center;color:var(--ink-2);font-size:14px;
  }
  .hidden{display:none}

  /* ============ 视频播放弹窗（iOS 底部 Sheet） ============ */
  .sheet-mask{
    position:fixed;inset:0;z-index:100;
    background:rgba(8,12,24,0.55);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    opacity:0;pointer-events:none;transition:opacity .35s;
  }
  .sheet-mask.open{opacity:1;pointer-events:auto}

  .player-sheet{
    position:fixed;left:50%;bottom:0;z-index:101;
    width:100%;max-width:520px;max-height:92vh;overflow-y:auto;
    transform:translate(-50%,105%);
    background:#fff;border-radius:28px 28px 0 0;
    box-shadow:0 -14px 48px rgba(0,0,0,0.16);
    transition:transform .38s cubic-bezier(0.32,0.72,0.24,1);
    -webkit-overflow-scrolling:touch;
  }
  .player-sheet.open{transform:translate(-50%,0)}
  .sheet-handle{width:44px;height:5px;border-radius:3px;background:rgba(15,23,42,0.15);margin:14px auto 12px}

  .player-stage{
    position:relative;margin:0 18px;border-radius:20px;overflow:hidden;background:#000;
    aspect-ratio:9/16;max-height:56vh;
    box-shadow:0 14px 36px rgba(0,0,0,0.16);
  }
  .player-stage video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
  .player-stage:fullscreen{border-radius:0;margin:0;max-height:none;aspect-ratio:auto;width:100vw;height:100vh}
  .player-stage:fullscreen video{object-fit:contain}

  .big-play{
    position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,0.12);transition:opacity .3s;cursor:pointer;
  }
  .big-play.hidden{opacity:0;pointer-events:none}
  .big-play .circle{
    width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,0.93);box-shadow:0 8px 28px rgba(0,0,0,0.3);
  }
  .big-play .circle svg{margin-left:4px}
  .big-play.pulse .circle{animation:breath 2s ease-in-out infinite}

  .close-btn{
    position:absolute;top:14px;right:14px;z-index:3;width:34px;height:34px;border-radius:50%;
    background:rgba(0,0,0,0.45);color:#fff;border:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:transform .2s var(--spring), background .25s;
  }
  .close-btn:hover{background:rgba(0,0,0,0.65)}
  .close-btn:active{transform:scale(0.9)}

  .controls{
    position:absolute;left:0;right:0;bottom:0;z-index:2;
    display:flex;align-items:center;gap:12px;padding:18px 16px 14px;
    background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,0.55));
    color:#fff;
  }
  .ctrl-btn{
    flex:0 0 auto;width:36px;height:36px;border:none;background:none;color:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;border-radius:50%;
    transition:transform .2s var(--spring), opacity .2s;
  }
  .ctrl-btn:hover{opacity:0.85}
  .ctrl-btn:active{transform:scale(0.9)}
  .progress{
    flex:1 1 auto;height:18px;display:flex;align-items:center;cursor:pointer;
    touch-action:none;min-width:0;
  }
  .progress .track{
    position:relative;width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,0.32);
  }
  .progress .bar{
    position:absolute;left:0;top:0;bottom:0;width:0%;border-radius:2px;background:#fff;
  }
  .progress .thumb{
    position:absolute;top:50%;left:0%;width:12px;height:12px;border-radius:50%;
    background:#fff;transform:translate(-50%,-50%);
    box-shadow:0 1px 4px rgba(0,0,0,0.45);
  }
  .time{
    flex:0 0 auto;font-size:12px;font-variant-numeric:tabular-nums;opacity:0.92;
    min-width:96px;text-align:right;
  }

  .player-meta{padding:20px 24px calc(34px + env(safe-area-inset-bottom))}
  .player-meta h3{font-size:18px;font-weight:700;line-height:1.4}
  .player-meta .tags{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
  .player-meta p{font-size:14px;color:var(--ink-2);line-height:1.7}

  /* ============ Footer ============ */
  footer{
    position:relative;z-index:1;padding:40px 24px calc(56px + env(safe-area-inset-bottom));
    text-align:center;max-width:620px;margin:0 auto;
  }
  .foot-divider{width:44px;height:4px;border-radius:2px;background:rgba(37,99,235,0.25);margin:0 auto 22px}
  .intro-card{
    max-width:520px;margin:0 auto;background:#fff;
    border:1px solid rgba(15,23,42,0.06);border-radius:24px;
    box-shadow:0 14px 40px rgba(15,23,42,0.07);
    padding:36px 28px 32px;text-align:center;
  }
  footer h3{font-size:26px;font-weight:800;letter-spacing:0.5px}
  footer .foot-role{font-size:15px;color:var(--accent);font-weight:600;margin-top:8px}
  footer p.bio{color:var(--ink-2);font-size:14px;line-height:1.8;margin-top:16px}
  .foot-contacts{display:flex;justify-content:center;gap:10px;margin-top:22px;flex-wrap:wrap}
  .btn-resume{
    margin-top:26px;display:inline-flex;align-items:center;gap:8px;
    padding:13px 30px;border-radius:999px;border:none;cursor:pointer;
    background:var(--accent);color:#fff;font-size:14px;font-weight:600;
    box-shadow:0 10px 24px rgba(37,99,235,0.28);
    transition:transform .2s var(--spring), box-shadow .25s, opacity .25s;
  }
  .btn-resume:hover{box-shadow:0 14px 30px rgba(37,99,235,0.34)}
  .btn-resume:active{transform:scale(0.95)}
  .foot-note{margin-top:18px;font-size:11.5px;color:#94A3B8}

  /* ---- Toast ---- */
  .toast{
    position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));z-index:300;
    transform:translate(-50%,14px);
    background:rgba(15,23,42,0.92);color:#fff;font-size:13px;padding:10px 18px;border-radius:999px;
    opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
    max-width:82vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:0.01ms!important;transition-duration:0.01ms!important}
  }
</style>
</head>

/* =============================================================
   一、作品集配置 —— 在这里替换成你自己的信息

   1. 封面图：把图片文件放进本页面同目录的 assets/ 文件夹，

      一个作品可属于多个分类，例如 ['AE类','UE类']
   4. 标签 tags、标题 title、描述 description 直接改对应字段
   5. 新增封面图后，记得把图片文件放进 assets/ 文件夹，
      并在页面顶部"资源预载引用"区域同步加一行 <img src="assets/你的封面.jpg">
      （用于发布时自动收集图片资源）
   ============================================================= */
const PROFILE = {
  name: '周子',
  role: '买量视频设计师',
  email: '2283808009@qq.com',        // 改成你的邮箱
  wechat: '19854738432',             // 改成你的微信号

/* ---------- Toast ---------- */
let toastTimer = null;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ---------- 复制到剪贴板 ---------- */
function copyText(text, msg){
  const done = () => toast(msg || '已复制');
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;opacity:0;left:-9999px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast('复制失败，请手动复制'); }
  ta.remove();
}

  if (!b || b.dataset.cat === activeCat) return;
  activeCat = b.dataset.cat;
  tabsInner.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === b));
  moveIndicator();
  b.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  renderWorks();
});

function renderWorks(){
  const list = activeCat === '全部' ? WORKS : WORKS.filter(w => w.category.includes(activeCat));
  emptyState.classList.toggle('hidden', list.length > 0);
  carousel.innerHTML = '';
  if (!list.length) return;
  list.forEach((w, i) => {
    const card = document.createElement('div');
    card.className = 'work-card' + (i === 0 ? ' active' : '');
    card.dataset.id = w.id;
    card.style.animationDelay = (i * 60) + 'ms';
    const tags = (w.tags || []).map(t => '<span class="tag">' + esc(t) + '</span>').join('');
    card.innerHTML =
      '<div class="card-cover">' +
        '<img src="' + esc(w.cover) + '" alt="' + esc(w.title) + '" loading="lazy">' +
        '<div class="play-badge"><div class="circle">' +
          '<svg width="22" height="22" viewBox="0 0 24 24" fill="#2563EB"><path d="M8 5.5v13l11-6.5z"/></svg>' +
        '</div></div>' +
      '</div>' +

        '<div class="card-tags">' + tags + '</div>' +
        '<h3 class="card-title">' + esc(w.title) + '</h3>' +
        '<p class="card-desc">' + esc(w.description || '') + '</p>' +
      '</div>';

  });
  carousel.scrollLeft = 0;

}
function esc(s){
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ---------- 卡片居中缩放（当前卡片放大、两侧缩小） ---------- */
let cardRaf = null;
function updateCardStates(){
  const cards = carousel.querySelectorAll('.work-card');
  if (!cards.length) return;
  const vpCenter = window.innerWidth / 2;
  let best = null, bestD = Infinity;
  cards.forEach(c => {
    const r = c.getBoundingClientRect();
    const cX = r.left + r.width / 2;
    const d = Math.abs(cX - vpCenter);
    const scale = Math.max(0.9, 1 - d / (r.width * 3.2));
    const op = Math.max(0.45, 1 - d / (r.width * 1.9));
    c.style.transform = 'scale(' + scale + ')';
    c.style.opacity = op;
    c.classList.toggle('active', d < r.width * 0.25);
    if (d < bestD) { bestD = d; best = c; }
  });
}
carousel.addEventListener('scroll', () => {
  if (cardRaf) return;
  cardRaf = requestAnimationFrame(() => { updateCardStates(); cardRaf = null; });
}, { passive: true });
window.addEventListener('resize', updateCardStates);

/* ---------- 桌面鼠标拖拽 + 惯性吸附 ---------- */
let isDown = false, startX = 0, startScroll = 0, lastX = 0, lastT = 0, vel = 0, inertiaRaf = null;

carousel.addEventListener('pointerdown', (e) => {
  if (e.pointerType !== 'mouse') return;
  isDown = true; moved = false; vel = 0;
  startX = e.clientX; startScroll = carousel.scrollLeft;
  lastX = e.clientX; lastT = performance.now();
  carousel.classList.add('dragging');
});
carousel.addEventListener('pointermove', (e) => {
  if (!isDown) return;
  const dx = e.clientX - startX;
  if (Math.abs(dx) > 4) moved = true;
  const now = performance.now(), dt = now - lastT;
  if (dt > 0) { vel = (e.clientX - lastX) / dt; lastX = e.clientX; lastT = now; }
  carousel.scrollLeft = startScroll - dx;
});
function endDrag(){
  if (!isDown) return;
  isDown = false;
  carousel.classList.remove('dragging');
  const v = Math.max(-42, Math.min(42, vel * 14));
  if (moved && Math.abs(v) > 0.6) {
    cancelAnimationFrame(inertiaRaf);
    const step = () => {
      carousel.scrollLeft -= v;
      v *= 0.94;
      if (Math.abs(v) > 0.3) inertiaRaf = requestAnimationFrame(step);
    };
    inertiaRaf = requestAnimationFrame(step);
  }
}
carousel.addEventListener('pointerup', endDrag);
carousel.addEventListener('pointercancel', endDrag);

/* ---------- 点击卡片 → 打开播放器 ---------- */
carousel.addEventListener('click', (e) => {
  if (moved) { moved = false; return; }
  const card = e.target.closest('.work-card') ||
               (document.elementFromPoint(e.clientX, e.clientY) || document.body).closest('.work-card');
  if (!card) return;
  const work = workById.get(Number(card.dataset.id));
  if (work) openPlayer(work);
});

const sheet = $('playerSheet');
const mask = $('sheetMask');
const video = $('playerVideo');
const stage = $('playerStage');
let currentWork = null;
let isSeeking = false;

function openPlayer(w){
  currentWork = w;
  video.src = w.videoUrl;
  video.poster = w.cover;
  $('playerTitle').textContent = w.title;
  $('playerDesc').textContent = w.description || '';
  $('playerTags').innerHTML = (w.tags || []).map(t => '<span class="tag">' + esc(t) + '</span>').join('');
  $('timeText').textContent = '00:00 / 00:00';
  setProgress(0);
  mask.classList.add('open');
  sheet.classList.add('open');
  document.body.style.overflow = 'hidden';
  video.load();
  video.play().then(updatePlayUI).catch(() => updatePlayUI());
  updatePlayUI();
}
function closePlayer(){
  video.pause();
  mask.classList.remove('open');
  sheet.classList.remove('open');
  document.body.style.overflow = '';
  setTimeout(() => {
    video.removeAttribute('src');
    video.load();
  }, 420);
}
$('closeBtn').addEventListener('click', closePlayer);
mask.addEventListener('click', closePlayer);

function updatePlayUI(){
  const playing = !video.paused && !video.ended;
  $('iconPlay').style.display = playing ? 'none' : 'block';
  $('iconPause').style.display = playing ? 'block' : 'none';
  $('bigPlay').classList.toggle('hidden', playing);
  $('bigPlay').classList.toggle('pulse', !playing);
}
function togglePlay(){
  if (video.paused) video.play().then(updatePlayUI).catch(() => {});
  else video.pause();
  updatePlayUI();
}
$('btnPlay').addEventListener('click', togglePlay);
$('bigPlay').addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });
video.addEventListener('click', (e) => {
  if (e.target === video) togglePlay();
});
video.addEventListener('play', updatePlayUI);
video.addEventListener('pause', updatePlayUI);
video.addEventListener('ended', updatePlayUI);

function fmt(t){
  if (!isFinite(t)) return '00:00';
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}
function setProgress(pct){
  $('progressBarFill').style.width = pct + '%';
  $('progressThumb').style.left = pct + '%';
}
function updateProgress(){
  const d = video.duration || 0;
  const pct = d ? (video.currentTime / d) * 100 : 0;
  setProgress(pct);
  $('timeText').textContent = fmt(video.currentTime) + ' / ' + fmt(d);
}
video.addEventListener('timeupdate', updateProgress);
video.addEventListener('loadedmetadata', updateProgress);
video.addEventListener('progress', updateProgress);

const progressBar = $('progressBar');
function seekFromEvent(e){
  const r = progressBar.getBoundingClientRect();
  const ratio = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  if (video.duration) video.currentTime = ratio * video.duration;
  setProgress(ratio * 100);
  $('timeText').textContent = fmt(video.currentTime) + ' / ' + fmt(video.duration || 0);
}
progressBar.addEventListener('pointerdown', (e) => {
  isSeeking = true;
  seekFromEvent(e);
  progressBar.setPointerCapture(e.pointerId);
});
progressBar.addEventListener('pointermove', (e) => {
  if (isSeeking) seekFromEvent(e);
});
progressBar.addEventListener('pointerup', () => { isSeeking = false; });
progressBar.addEventListener('pointercancel', () => { isSeeking = false; });

$('btnFullscreen').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else if (stage.requestFullscreen) stage.requestFullscreen();
});
document.addEventListener('fullscreenchange', () => {
  const fs = !!document.fullscreenElement;
  $('iconExpand').style.display = fs ? 'none' : 'block';
  $('iconCompress').style.display = fs ? 'block' : 'none';
});

/* ---------- 下载简历 ---------- */
$('btnResume').addEventListener('click', () => {
  if (!PROFILE.resumeUrl) { toast('简历文档待上传，可通过微信联系获取'); return; }
  // 本地打开（file://）时浏览器不支持 download，改为新标签预览；发布到线上后自动直接下载
  if (location.protocol === 'file:') { window.open(PROFILE.resumeUrl, '_blank'); return; }
  const a = document.createElement('a');
  a.href = PROFILE.resumeUrl;
  a.download = '周子_买量视频设计师_简历.pdf';
  document.body.appendChild(a);
  a.click();
  a.remove();
});

/* ---------- 初始化 ---------- */
renderProfile();
renderTabs();
renderWorks();
</script>
